name: CI

# This repo is the frontend only — backend and mobile are separate
# repositories with their own history and CI.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npm run lint

      - name: Spec (headless Chrome)
        run: npm run spec

      - name: Build (production)
        run: npm run build -- --configuration production
