<div class="apro" [class.is-soft]="tone === 'soft'">
  <aside class="apro-panel">
    <a routerLink="/" class="apro-brand">
      <span class="apro-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 4v16M18 4v16M3 8v8M21 8v8M6 12h12" /></svg>
      </span>
      Fitora
    </a>

    <div class="apro-panel-body">
      <ng-content select="[authPanel]"></ng-content>
    </div>

    <span class="apro-panel-foot">{{ "auth.panel_support" | translate }}</span>
  </aside>

  <div class="apro-side">
    <header class="apro-bar">
      <a routerLink="/" class="apro-brand apro-brand--bar">
        <span class="apro-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 4v16M18 4v16M3 8v8M21 8v8M6 12h12" /></svg>
        </span>
        Fitora
      </a>

      @if (backLinkText) {
        <a [routerLink]="backLink" class="apro-back">
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
          {{ backLinkText }}
        </a>
      }

      <div class="apro-bar-end">
        @if (asideLinkText) {
          <span class="apro-aside">
            {{ asideText }}
            <a [routerLink]="asideLink">{{ asideLinkText }}</a>
          </span>
        }

        <div class="apro-lang" role="group" [attr.aria-label]="'common.change_language' | translate">
          @for (l of locales; track l.code) {
            <button
              type="button"
              [class.is-active]="locale.locale() === l.code"
              [attr.aria-pressed]="locale.locale() === l.code"
              [attr.aria-label]="l.label"
              [attr.lang]="l.code"
              (click)="locale.setLocale(l.code)"
            >
              {{ shortLabel[l.code] }}
            </button>
          }
        </div>
      </div>
    </header>

    <main class="apro-main">
      <div class="apro-col" [class.is-wide]="wide">
        <ng-content></ng-content>
      </div>
    </main>

    <footer class="apro-foot">
      © {{ year }} Fitora ·
      <a href="mailto:contact@fitora.io">{{ "landing.footer_contact" | translate }}</a>
    </footer>
  </div>
</div>
