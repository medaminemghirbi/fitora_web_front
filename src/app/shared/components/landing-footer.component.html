<footer class="mkt-footer">
  <div class="mkt-container">
    <div class="mkt-footer-row">
      <a routerLink="/" class="mkt-brand mkt-brand--light">
        <span class="mkt-brand-mark"><i class="bi bi-lightning-charge-fill"></i></span>
        FITORA
      </a>

      <nav class="mkt-footer-links">
        <a [routerLink]="['/']" fragment="features">{{ "landing.nav_features" | translate }}</a>
        <a routerLink="/connexion">{{ "auth.login" | translate }}</a>
        <a href="mailto:contact@fitora.io">{{ "landing.footer_contact" | translate }}</a>
      </nav>
    </div>

    <div class="mkt-footer-copy">© {{ currentYear }} FITORA. {{ "landing.footer_rights" | translate }}</div>
  </div>
</footer>
